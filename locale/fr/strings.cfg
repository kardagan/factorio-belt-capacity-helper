[mod-name]
BeltCapacityHelper=Belt Capacity Helper

[mod-description]
BeltCapacityHelper=Affiche combien de machines un seul tapis peut alimenter, pour la machine ouverte.

[bch]
window-title=Capacité des tapis

row-lanes=Lanes
row-consumption=Par machine
row-production=Par machine
header-supported=Machines
header-supported-tooltip=Combien de machines UN SEUL tapis de ce tier peut alimenter, avec votre configuration de lanes.\n\nChaque colonne d'ingrédient dit combien de machines cet ingrédient seul pourrait nourrir. La machine ne tourne que si TOUS ses ingrédients arrivent, donc le total est la plus petite de ces valeurs.\n\nExemple : 40 / 12 / 60 → 12 machines. C'est l'ingrédient du milieu qui bloque.

bonus-speed=vitesse
bonus-productivity=productivité
bonus-quality=qualité

lane-1-tooltip=Une seule lane du tapis alimente cette machine\n(l'autre lane transporte autre chose, ou rien)\n\nCliquez pour passer au tapis complet
lane-2-tooltip=Le tapis complet alimente cette machine (deux lanes)\n\nCliquez pour ne compter qu'une seule lane

stack-down-tooltip=Diminuer l'empilage de cet objet
stack-up-tooltip=Augmenter l'empilage de cet objet\n\nAu-delà de votre recherche (×__1__), les chiffres deviennent de la planification.
stack-locked-tooltip=Empilage verrouillé sur votre recherche\n\nLes chiffres correspondent à votre partie.\nCliquez pour débloquer et simuler des niveaux supérieurs.
stack-unlocked-tooltip=⚠ Mode planification\n\nVous pouvez choisir un empilage NON recherché.\nCliquez pour revenir à votre niveau réel.
planning-warning=⚠ Mode planification — empilage ×__1__ non recherché

reset-tooltip=Remet tous les boutons de lanes de cette recette à 2 lanes.

outputs-header=Sortie
fluids-header=Fluides (hors tapis)

limiting=⚠ Ingrédient limitant : __1__ — c'est lui qui plafonne la colonne Machines
limiting-plural=⚠ Ingrédients limitants : __1__ — à égalité, ce sont eux qui plafonnent la colonne Machines

ingredient-tooltip=__1__\n\nConsommation : __2__/s par machine (__3__ par craft)\n\nLes nombres de cette colonne = combien de machines CET ingrédient seul pourrait alimenter, selon le tier de tapis.
product-tooltip=__1__\n\nProduction : __2__/s par machine\n\nLes nombres de cette colonne = combien de machines il faut pour saturer un tapis de ce tier.
stacked-note=\n\n⚡ Empilage tapis : __1__ objets par case (recherche débloquée)
no-stack-note=\n\n⚠ Cet objet ne s'empile pas sur tapis (stack size 1)
belt-tooltip=__1__\n__2__ cases/s par lane\n(à multiplier par l'empilage : voir le tooltip de chaque ingrédient)

no-machine=Aucune machine de fabrication ouverte ou sélectionnée
no-recipe=Aucune recette définie sur cette machine
no-belts=Aucun tapis trouvé
debug-help=Affiche ce que l'API renvoie pour la machine ouverte ou survolée.
no-solid-ingredients=Cette recette n'a aucun ingrédient solide.

[mod-setting-name]
bch-auto-open=Ouverture automatique
bch-only-unlocked-belts=Afficher uniquement les tapis débloqués
bch-show-fluids=Afficher les débits de fluides

[mod-setting-description]
bch-auto-open=Ouvre la fenêtre dès qu'une machine de fabrication est ouverte, sans appuyer sur le raccourci.
bch-only-unlocked-belts=Masque les tiers de tapis non encore recherchés. Utile avec les mods qui ajoutent beaucoup de tiers.
bch-show-fluids=Liste les ingrédients et produits fluides avec leur débit. Les fluides ne sont jamais traduits en nombre de tapis.

[controls]
bch-toggle-window=Afficher/masquer la fenêtre Capacité des tapis

[shortcut-name]
bch-toggle-window=Capacité des tapis
