[mod-name]
BeltCapacityHelper=Belt Capacity Helper

[mod-description]
BeltCapacityHelper=Shows how many machines a single belt can feed, for the machine you have open.

[bch]
window-title=Belt Capacity

row-lanes=Lanes
row-consumption=Per machine
row-production=Per machine
header-supported=Machines
header-supported-tooltip=How many machines ONE belt of this tier can feed, with your lane setup.\n\nEach ingredient column says how many machines that ingredient alone could supply. A machine only runs when ALL its ingredients arrive, so the total is the smallest of those values.\n\nExample: 40 / 12 / 60 → 12 machines. The middle ingredient is the bottleneck.

bonus-speed=speed
bonus-productivity=productivity
bonus-quality=quality

lane-1-tooltip=A single belt lane feeds this machine\n(the other lane carries something else, or nothing)\n\nClick to switch to a full belt
lane-2-tooltip=The full belt feeds this machine (both lanes)\n\nClick to count a single lane only

stack-down-tooltip=Lower this item's stacking
stack-up-tooltip=Raise this item's stacking\n\nAbove your research (×__1__) the numbers become planning figures.
stack-locked-tooltip=Stacking locked to your research\n\nThe numbers match your save.\nClick to unlock and simulate higher levels.
stack-unlocked-tooltip=⚠ Planning mode\n\nYou can pick a stacking level you have not researched.\nClick to snap back to your real level.
planning-warning=⚠ Planning mode — stacking ×__1__ is not researched

reset-tooltip=Reset every lane toggle for this recipe back to 2 lanes.

outputs-header=Output
fluids-header=Fluids (not belt-carried)

limiting=⚠ Limiting ingredient: __1__ — it caps the Machines column
limiting-plural=⚠ Limiting ingredients: __1__ — tied, they cap the Machines column

ingredient-tooltip=__1__\n\nConsumption: __2__/s per machine (__3__ per craft)\n\nNumbers in this column = how many machines THIS ingredient alone could feed, per belt tier.
product-tooltip=__1__\n\nProduction: __2__/s per machine\n\nNumbers in this column = how many machines it takes to saturate a belt of that tier.
stacked-note=\n\n⚡ Belt stacking: __1__ items per slot (researched)
no-stack-note=\n\n⚠ This item does not stack on belts (stack size 1)
belt-tooltip=__1__\n__2__ slots/s per lane\n(multiply by stacking: see each ingredient tooltip)

no-machine=No crafting machine open or selected
no-recipe=No recipe set on this machine
no-belts=No belts found
debug-help=Report what the API returns for the machine you have open or selected.
no-solid-ingredients=This recipe has no solid ingredients.

[mod-setting-name]
bch-auto-open=Open automatically
bch-only-unlocked-belts=Only show unlocked belts
bch-show-fluids=Show fluid rates

[mod-setting-description]
bch-auto-open=Open the window as soon as a crafting machine is opened, without pressing the shortcut.
bch-only-unlocked-belts=Hide belt tiers you have not researched yet. Useful with mods that add many tiers.
bch-show-fluids=List fluid ingredients and products with their rate. Fluids are never translated into belt counts.

[controls]
bch-toggle-window=Toggle Belt Capacity window

[shortcut-name]
bch-toggle-window=Belt Capacity
